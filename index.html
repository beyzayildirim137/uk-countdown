<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>UK Macerası 🚀</title>
<style>
body {
  background: linear-gradient(to top, #87CEEB, #fff);
  font-family: Arial, sans-serif;
  overflow: hidden;
  position: relative;
  height: 100vh;
}

#planeContainer {
  position: absolute;
  display: none; /* Animasyon başlamadan gizli */
  top: 30%;
  right: -250px;
  width: 250px;
}

#plane {
  width: 100%;
}

.kafa {
  position: absolute;
  width: 50px;
  border-radius: 50%;
  top: -20px; /* Uçağın üstüne yerleştir */
}

@keyframes fly {
  0% { right: -250px; }
  100% { right: 100vw; }
}

button {
  position: absolute;
  bottom: 50px;
  left: 50%;
  transform: translateX(-50%);
  padding: 15px 25px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: #ffdd00;
}
</style>
</head>
<body>

<h1 style="text-align:center; margin-top:50px;">✈️ UK Macerasına Kalan Süre ✈️</h1>

<div id="planeContainer">
  <img id="plane" src="plane.png" alt="Uçak">
  <img class="kafa" src="kafa1.png" style="left: 30px;">
  <img class="kafa" src="kafa2.png" style="left: 150px;">
</div>

<button onclick="startParty()">🎉 Sürprizi Başlat 🎉</button>

<script>
function startParty() {
  // Uçak ve kafaları göster ve animasyonu başlat
  const plane = document.getElementById('planeContainer');
  plane.style.display = 'block';
  plane.style.animation = 'fly 4s linear forwards';
}
</script>

</body>
</html>
