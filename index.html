<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>UK Kaçış Planı 🇬🇧</title>
<style>
body {
  background: linear-gradient(to right, #012169, #C8102E);
  color: white;
  font-family: Arial;
  text-align: center;
  padding-top: 100px;
}
#countdown {
  font-size: 50px;
  margin-top: 30px;
}
</style>
</head>
<body>

<h1>🇬🇧 UK Macerasına Kalan Süre 🇬🇧</h1>
<h2> BAAALIIIIMMM Bavulu Hazırla 😌</h2>

<div id="countdown"></div>

<script>
const tripDate = new Date("2026-04-20T10:00:00").getTime(); // BURAYI DEĞİŞTİR

setInterval(function() {
  const now = new Date().getTime();
  const distance = tripDate - now;

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((distance / 1000 / 60) % 60);
  const seconds = Math.floor((distance / 1000) % 60);

  document.getElementById("countdown").innerHTML =
  days + " gün " + hours + " saat " +
  minutes + " dakika " + seconds + " saniye ❤️";
}, 1000);
</script>
<div id="catContainer" style="margin-top:50px;">
  <img src="happycat.gif" width="250">
</div>

<button onclick="startParty()" 
style="padding:15px; font-size:20px; border:none; border-radius:10px; cursor:pointer; margin-top:30px;">
🎉 Sürprizi Başlat 🎉
</button>

<audio id="bgMusic" loop>
  <source src="happy.mp3" type="audio/mpeg">
</audio>

<script>
function startParty() {
  document.getElementById("bgMusic").play();
  document.getElementById("catContainer").style.display = "block";
}
</script>
</body>
</html>
