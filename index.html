<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>UK Macerası 🚀</title>
<style>
body {
  background: linear-gradient(to top, #87CEEB, #fff);
  font-family: Arial, sans-serif;
  overflow: hidden;
  position: relative;
  height: 100vh;
  text-align: center;
}

#countdown {
  font-size: 40px;
  margin-top: 50px;
  color: #333;
}

#planeContainer {
  position: absolute;
  display: none; /* Animasyon başlamadan gizli */
  top: 25%;
  right: -500px;
  width: 500px;
}

#plane {
  width: 100%;
}

@keyframes fly {
  0% { right: -250px; }
  100% { right: 100vw; }
}

button {
  position: absolute;
  bottom: 50px;
  left: 50%;
  transform: translateX(-50%);
  padding: 15px 25px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: #ffdd00;
}
</style>
</head>
<body>

<h1>✈️ UK Macerasına Kalan Süre ✈️</h1>
<div id="countdown"></div>

<div id="planeContainer">
  <img id="plane" src="plane.png" alt="Uçak">
</div>
<audio id="planeSound" src="hasss.mp3"></audio>
<button onclick="startParty()">🎉 UCUURRR BIZIII 🎉</button>

<script>
// Geri sayım
const tripDate = new Date("2026-04-20T10:00:00").getTime(); // Uçuş tarihini değiştir
const countdownEl = document.getElementById("countdown");

setInterval(() => {
  const now = new Date().getTime();
  const distance = tripDate - now;

  const days = Math.floor(distance / (1000*60*60*24));
  const hours = Math.floor((distance / (1000*60*60)) % 24);
  const minutes = Math.floor((distance / (1000*60)) % 60);
  const seconds = Math.floor((distance / 1000) % 60);

  countdownEl.innerHTML = `${days} gün ${hours} saat ${minutes} dakika ${seconds} saniye ❤️`;
}, 1000);

// Uçak animasyonu + müzik
function startParty() {
  const plane = document.getElementById('planeContainer');
  const sound = document.getElementById('planeSound');

  // Animasyonu resetle
  plane.style.display = 'block';
  plane.style.animation = 'none';
  
  // Force reflow → animasyonun yeniden başlaması için
  void plane.offsetWidth;

  plane.style.animation = 'fly 4s linear forwards';

  // Ses başlat
  sound.pause();
  sound.currentTime = 0;
  sound.play().catch(e => console.log("Ses çalınamadı:", e));
}
</script>

</body>
</html>
